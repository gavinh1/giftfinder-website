<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Support – Givly</title>
</head>

<body style="max-width: 600px; margin: 40px auto; font-family: -apple-system, BlinkMacSystemFont, sans-serif; line-height: 1.5;">
  
  
  <h1>Support</h1>
  <p>If you need help or want to report an issue, please fill out the form below.</p>

  <form action="mailto:support@givly.app" method="POST" enctype="text/plain">
    
    <label>
      Your Email<br />
      <input type="email" name="email" required style="width:100%; padding:8px; margin:8px 0;" />
    </label>

    <label>
      Subject<br />
      <input type="text" name="subject" required style="width:100%; padding:8px; margin:8px 0;" />
    </label>

    <label>
      Message<br />
      <textarea name="message" rows="6" required style="width:100%; padding:8px; margin:8px 0;"></textarea>
    </label>

    <button type="submit" style="padding:10px 16px; margin-top:10px; font-size:16px;">
      Send Message
    </button>

  </form>

  <p style="font-size:12px; color:#666; margin-top:20px;">
    This will open your email app to send the message.
  </p>

</body>
</html>
